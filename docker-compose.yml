services:
  aegisx-soc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegisx_soc_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
    volumes:
      - aegisx_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aegisx_data:
    driver: local
